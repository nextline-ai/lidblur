<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C3A5C"/>
      <stop offset="1" stop-color="#0D1220"/>
    </linearGradient>
    <!-- soft light pool behind the screen (approximates a gaussian falloff) -->
    <radialGradient id="pool" cx="512" cy="430" r="560" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(0 430) scale(1 0.8) translate(0 -430)">
      <stop offset="0"    stop-color="#6A5AD0" stop-opacity="0.62"/>
      <stop offset="0.25" stop-color="#6A5AD0" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#6A5AD0" stop-opacity="0.26"/>
      <stop offset="0.65" stop-color="#6A5AD0" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#6A5AD0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#pool)"/>
</svg>
